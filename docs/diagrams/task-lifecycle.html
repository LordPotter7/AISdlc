<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Task state machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · AI SDLC</p>
    <h1>The Task state machine</h1>

    <svg viewBox="0 0 1208 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="task-lifecycle-title task-lifecycle-desc">
      <title id="task-lifecycle-title">The Task state machine</title>
      <desc id="task-lifecycle-desc">State machine showing a Task moving from ready through in progress, verifying, under review, verified and merged, with failed checks or a changes-required review routing it into retry, and an unresolvable Task routing into blocked before returning to in progress.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Transitions (drawn first, behind states) -->
      <line x1="38" y1="148" x2="64" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="208" y1="148" x2="256" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="148" x2="448" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="592" y1="148" x2="640" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="784" y1="148" x2="832" y2="148" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="976" y1="148" x2="1024" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- verifying → retry -->
      <line x1="520" y1="184" x2="520" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- review → retry -->
      <path d="M 712,184 V 264 Q 712,272 704,272 H 544 Q 536,272 536,280 V 304"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- retry → in progress -->
      <path d="M 448,340 H 376 Q 368,340 368,332 V 184"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- in progress → blocked -->
      <path d="M 296,184 V 272 Q 296,280 288,280 H 208 Q 200,280 200,288 V 304"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- blocked → in progress -->
      <path d="M 272,328 H 344 Q 352,328 352,320 V 184"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Transition labels -->
      <rect x="210" y="128" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="232" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">START</text>

      <rect x="402" y="128" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">DIFF</text>

      <rect x="594" y="128" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="616" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PASS</text>

      <rect x="786" y="128" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="808" y="137" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">APPROVE</text>

      <rect x="978" y="128" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1000" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">MERGE</text>

      <rect x="528" y="238" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="247" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK FAIL</text>

      <rect x="600" y="252" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="644" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHANGES REQ</text>

      <rect x="392" y="320" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="418" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRY x2</text>

      <rect x="224" y="214" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="223" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BLOCKED</text>

      <rect x="280" y="308" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="310" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UNBLOCK</text>

      <!-- Start dot -->
      <circle cx="32" cy="148" r="6" fill="#2d3142"/>
      <text x="32" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pending</text>

      <!-- State: ready -->
      <rect x="64" y="112" width="144" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="64" y="112" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="122" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="92" y="131" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="136" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ready</text>
      <text x="136" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deps + gate met</text>

      <!-- State: in progress -->
      <rect x="256" y="112" width="144" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="256" y="112" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="264" y="122" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="284" y="131" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="328" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">In progress</text>
      <text x="328" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">implementing</text>

      <!-- State: verifying -->
      <rect x="448" y="112" width="144" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="448" y="112" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="456" y="122" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="476" y="131" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="520" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verifying</text>
      <text x="520" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">visible + held-out</text>

      <!-- State: review -->
      <rect x="640" y="112" width="144" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="640" y="112" width="144" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="648" y="122" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="668" y="131" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="712" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Under review</text>
      <text x="712" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">other model family</text>

      <!-- State: verified (focal) -->
      <rect x="832" y="112" width="144" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="832" y="112" width="144" height="72" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="840" y="122" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="860" y="131" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="904" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verified</text>
      <text x="904" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CI evidence pinned</text>

      <!-- State: merged -->
      <rect x="1024" y="112" width="144" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="1024" y="112" width="144" height="72" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="1032" y="122" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="1052" y="131" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="1096" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Merged</text>
      <text x="1096" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">on integration ref</text>

      <!-- State: blocked -->
      <rect x="128" y="304" width="144" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="128" y="304" width="144" height="72" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="136" y="314" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="156" y="323" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="200" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blocked</text>
      <text x="200" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">escalation package</text>

      <!-- State: retry -->
      <rect x="448" y="304" width="144" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="448" y="304" width="144" height="72" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="456" y="314" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="476" y="323" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="520" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retry</text>
      <text x="520" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">two attempts max</text>

      <!-- Editorial callout -->
      <text x="640" y="424" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">A conformance gap is not a flake. Fix the implementation — never the held-out test.</text>

      <!-- Legend strip -->
      <line x1="40" y1="464" x2="1168" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="500" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="508" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Normal progression</text>

      <rect x="216" y="500" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="236" y="508" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Independently verified</text>

      <rect x="416" y="500" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="436" y="508" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Escalation</text>

      <text x="560" y="508" fill="#7a8399" font-size="8.5" font-family="'Geist', sans-serif">Terminal states — superseded, failed, reverted — are reached by their own runner verbs, never by editing a record.</text>
    </svg>
  </div>
</body>
</html>
