<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which onboarding path is yours</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · AI SDLC</p>
    <h1>Which onboarding path is yours</h1>

    <svg viewBox="0 0 1120 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="onboarding-paths-title onboarding-paths-desc">
      <title id="onboarding-paths-title">Which onboarding path is yours</title>
      <desc id="onboarding-paths-desc">Flowchart routing a reader to one of five onboarding paths: a teammate to path C, a non-Claude tool to path D, a new repository to path A, a single existing codebase to path B, and several repositories or a program to path E.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <line x1="520" y1="88" x2="520" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="408" y1="168" x2="240" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="632" y1="168" x2="800" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="216" x2="520" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="408" y1="312" x2="240" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="360" x2="520" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="632" y1="456" x2="800" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="504" x2="520" y2="552" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="288" y="148" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="324" y="157" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">A PERSON</text>

      <rect x="680" y="148" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="712" y="157" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">A TOOL</text>

      <rect x="528" y="234" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="572" y="243" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">A REPOSITORY</text>

      <rect x="296" y="292" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="328" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">EMPTY</text>

      <rect x="528" y="378" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="564" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">HAS CODE</text>

      <rect x="680" y="436" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="724" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">MANY REPOS</text>

      <rect x="528" y="522" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="564" y="531" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ONE REPO</text>

      <!-- Start oval -->
      <rect x="440" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="520" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Adopt AI SDLC</text>
      <text x="520" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">machine setup done</text>

      <!-- Decision 1 -->
      <polygon points="520,120 632,168 520,216 408,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="164" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">What are you</text>
      <text x="520" y="180" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">onboarding?</text>

      <!-- End: Path C -->
      <rect x="80" y="144" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="160" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Path C</text>
      <text x="160" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a new teammate</text>

      <!-- End: Path D -->
      <rect x="800" y="144" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="880" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Path D</text>
      <text x="880" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a non-Claude agent</text>

      <!-- Decision 2 -->
      <polygon points="520,264 632,312 520,360 408,312" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="308" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Does it already</text>
      <text x="520" y="324" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">have code?</text>

      <!-- End: Path A -->
      <rect x="80" y="288" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="160" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Path A</text>
      <text x="160" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">greenfield</text>

      <!-- Decision 3 -->
      <polygon points="520,408 632,456 520,504 408,456" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="452" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">How many</text>
      <text x="520" y="468" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">repositories?</text>

      <!-- End: Path E -->
      <rect x="800" y="432" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="880" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Path E</text>
      <text x="880" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">programs · federation</text>

      <!-- End: Path B (focal) -->
      <rect x="440" y="552" width="160" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="520" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Path B</text>
      <text x="520" y="596" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">brownfield</text>

      <!-- Legend strip -->
      <line x1="40" y1="640" x2="1080" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="676" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Destination path (oval)</text>

      <polygon points="252,682 264,676 276,682 264,688" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="288" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

      <rect x="452" y="676" width="24" height="12" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="484" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Most common case</text>

      <line x1="656" y1="682" x2="684" y2="682" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="692" y="686" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Route most teams take</text>
    </svg>
  </div>
</body>
</html>
