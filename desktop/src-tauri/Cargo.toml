[package]
name = "aisdlc-studio"
version = "0.2.0"
description = "AISDLC Studio: native shell, project registry, bridge supervisor and watcher"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "aisdlc_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
