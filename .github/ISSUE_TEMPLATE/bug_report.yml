name: Bug report
description: Something in the runner, hooks, commands, or Studio does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Do not file it here. See SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran (runner or `/aisdlc:*`), with the Intent or Task ID if any.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `/aisdlc:doctor`
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python version, Claude Code version, plugin version"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [runner, hooks/guard, slash commands, agents/skill, AISDLC Studio, docs]
