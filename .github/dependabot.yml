version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
