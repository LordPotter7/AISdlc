<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="path-b-title path-b-desc">
      <title id="path-b-title">Path B — an existing codebase</title>
      <desc id="path-b-desc">Flowchart of brownfield onboarding: scaffold and check, build a structural understanding from exactly one source — the code or the documents, never both — anchor and pin it, capture a behavioural baseline, then start the first Intent with criteria measured against that baseline.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <path d="M 264,112 V 136 Q 264,144 272,144 H 328 Q 336,144 336,152 V 176"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 424,112 V 136 Q 424,144 416,144 H 360 Q 352,144 352,152 V 176"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="216" y1="208" x2="256" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="432" y1="208" x2="472" y2="208" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="648" y1="208" x2="688" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="864" y1="208" x2="904" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow label: the one rule that matters most -->
      <rect x="312" y="82" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="344" y="91" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">PICK ONE</text>

      <!-- Source chip: code -->
      <rect x="216" y="64" width="96" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="64" width="96" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="264" y="88" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">The code</text>
      <text x="264" y="102" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">understand repo</text>

      <!-- Source chip: docs -->
      <rect x="376" y="64" width="96" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="376" y="64" width="96" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="424" y="88" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">The docs</text>
      <text x="424" y="102" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">understand docs</text>

      <!-- Step 1 -->
      <rect x="40" y="176" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="176" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="184" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="60" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="128" y="212" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scaffold and check</text>
      <text x="128" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">init · doctor</text>

      <!-- Step 2 (focal) -->
      <rect x="256" y="176" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="176" width="176" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="264" y="184" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="276" y="193" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="344" y="212" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build understanding</text>
      <text x="344" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cartographer · read-only</text>

      <!-- Step 3 -->
      <rect x="472" y="176" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="176" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="480" y="184" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="492" y="193" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="560" y="212" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Anchor and pin it</text>
      <text x="560" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">understand record</text>

      <!-- Step 4 -->
      <rect x="688" y="176" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="176" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="696" y="184" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="708" y="193" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="776" y="212" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pin what it does now</text>
      <text x="776" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">baseline capture</text>

      <!-- Step 5: end oval -->
      <rect x="904" y="176" width="176" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="992" y="212" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">First honest Intent</text>
      <text x="992" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">criteria vs baseline</text>

      <!-- Legend strip -->
      <line x1="40" y1="316" x2="1080" y2="316" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="352" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="60" y="360" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Source — one per run, never both</text>

      <rect x="320" y="352" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="340" y="360" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">What the system is — advisory, permanently</text>

      <rect x="712" y="352" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="732" y="360" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">What the system does — hashed, commit-pinned</text>
    </svg>
