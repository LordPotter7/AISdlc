<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="path-a-title path-a-desc">
      <title id="path-a-title">Path A — greenfield repository</title>
      <desc id="path-a-desc">Flowchart of greenfield onboarding: scaffold with init, check readiness with doctor, loop back through fixes until the checks are green, then fill the project context file, replace the CI placeholder, and run one small compact Intent end to end.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <line x1="200" y1="168" x2="240" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="168" x2="432" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="608" y1="168" x2="640" y2="168" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="800" y1="168" x2="840" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="216" x2="520" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 432,352 H 328 Q 320,352 320,344 V 200"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="920" y1="200" x2="920" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="584" y="148" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="157" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">GREEN</text>

      <rect x="528" y="262" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="271" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">WARN / FAIL</text>

      <rect x="344" y="332" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="376" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">RE-RUN</text>

      <rect x="928" y="254" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="956" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">READY</text>

      <!-- Step 1: init -->
      <rect x="40" y="136" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="136" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="144" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="60" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="120" y="172" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scaffold</text>
      <text x="120" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ai-sdlc init</text>

      <!-- Step 2: doctor -->
      <rect x="240" y="136" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="136" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="144" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="260" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="320" y="172" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Check readiness</text>
      <text x="320" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ai-sdlc doctor</text>

      <!-- Decision -->
      <polygon points="520,120 608,168 520,216 432,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="164" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">14 checks</text>
      <text x="520" y="180" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">clean?</text>

      <!-- Step 3: project context (focal) -->
      <rect x="640" y="136" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="136" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="648" y="144" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="660" y="153" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="720" y="172" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fill project context</text>
      <text x="720" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">project-context.md</text>

      <!-- Step 4: CI placeholder -->
      <rect x="840" y="136" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="136" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="848" y="144" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="860" y="153" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="920" y="172" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replace CI stub</text>
      <text x="920" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ai-sdlc-verify.yml</text>

      <!-- Remediation -->
      <rect x="432" y="320" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="320" width="176" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="520" y="352" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fix what doctor names</text>
      <text x="520" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runner · hooks · CI</text>

      <!-- End oval -->
      <rect x="800" y="320" width="240" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="920" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run one compact Intent</text>
      <text x="920" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">start → gates → close</text>

      <!-- Legend strip -->
      <line x1="40" y1="440" x2="1080" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="476" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step you run</text>

      <rect x="176" y="476" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="196" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Highest-value five minutes</text>

      <rect x="400" y="476" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="420" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Only if doctor complains</text>

      <line x1="616" y1="482" x2="644" y2="482" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="652" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Loop back</text>
    </svg>
