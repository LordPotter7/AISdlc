<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1184 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-gates-title lifecycle-gates-desc">
      <title id="lifecycle-gates-title">The lifecycle and its five gates</title>
      <desc id="lifecycle-gates-desc">Swimlane diagram across six stages — frame, specify, plan, build, converge, close — showing Claude drafting artifacts, the runner validating and recording them and capturing evidence during build, and a human approving gates one through five in a highlighted approval band along the bottom.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Human approval band (drawn before arrows and nodes) -->
      <rect x="184" y="432" width="960" height="112" rx="8"
            fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- Stage column dividers -->
      <line x1="344" y1="64" x2="344" y2="544" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
      <line x1="504" y1="64" x2="504" y2="544" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
      <line x1="664" y1="64" x2="664" y2="544" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
      <line x1="824" y1="64" x2="824" y2="544" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>
      <line x1="984" y1="64" x2="984" y2="544" stroke="rgba(45,49,66,0.06)" stroke-width="1"/>

      <!-- Actor column divider -->
      <line x1="184" y1="64" x2="184" y2="544" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Lane dividers -->
      <line x1="40" y1="96" x2="1144" y2="96" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="208" x2="1144" y2="208" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="320" x2="1144" y2="320" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="432" x2="1144" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
      <line x1="40" y1="544" x2="1144" y2="544" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- Stage headers -->
      <text x="264" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">1 · FRAME</text>
      <text x="424" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">2 · SPECIFY</text>
      <text x="584" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">3 · PLAN</text>
      <text x="744" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">4 · BUILD</text>
      <text x="904" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">5 · CONVERGE</text>
      <text x="1064" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">6 · CLOSE</text>

      <!-- Lane labels -->
      <text x="56" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CLAUDE</text>
      <text x="56" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">RUNNER</text>
      <text x="56" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">EVIDENCE</text>
      <text x="56" y="492" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HUMAN</text>

      <!-- Arrows (drawn first, behind boxes) -->
      <!-- Claude chain -->
      <line x1="328" y1="152" x2="360" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="488" y1="152" x2="520" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="648" y1="152" x2="680" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Claude → runner -->
      <line x1="264" y1="180" x2="264" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="744" y1="180" x2="744" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Runner → gates -->
      <line x1="264" y1="292" x2="264" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="424" y1="292" x2="424" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="584" y1="292" x2="584" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="904" y1="292" x2="904" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Runner → CI → gate 4 -->
      <line x1="744" y1="292" x2="744" y2="348" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="744" y1="404" x2="744" y2="460" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Arrow labels -->
      <rect x="272" y="194" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECORD</text>

      <rect x="752" y="194" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="778" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY</text>

      <rect x="752" y="306" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="786" y="315" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAPTURES</text>

      <rect x="752" y="418" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="782" y="427" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVIDENCE</text>

      <!-- CLAUDE lane steps -->
      <rect x="200" y="124" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="124" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="150" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frame brief</text>
      <text x="264" y="166" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/aisdlc:start</text>

      <rect x="360" y="124" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="124" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="424" y="150" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Draft criteria</text>
      <text x="424" y="166" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/aisdlc:specify</text>

      <rect x="520" y="124" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="124" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="584" y="150" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Draft plan</text>
      <text x="584" y="166" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/aisdlc:plan</text>

      <rect x="680" y="124" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="124" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="744" y="150" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Implement Task</text>
      <text x="744" y="166" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/aisdlc:run</text>

      <!-- RUNNER lane steps -->
      <rect x="200" y="236" width="448" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="236" width="448" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="424" y="262" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validate · assign permanent IDs · record state</text>
      <text x="424" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">schemas · locks · audit log · traceability</text>

      <rect x="680" y="236" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="236" width="128" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="744" y="262" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">verify-task</text>
      <text x="744" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">visible + held-out</text>

      <rect x="840" y="236" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="236" width="128" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="904" y="262" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">converge</text>
      <text x="904" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">traceability</text>

      <rect x="1000" y="236" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="1000" y="236" width="128" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="1064" y="262" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">close</text>
      <text x="1064" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">promote lessons</text>

      <!-- CI lane step -->
      <rect x="680" y="348" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="348" width="128" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="744" y="374" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Manifest</text>
      <text x="744" y="390" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hashed · commit-pinned</text>

      <!-- HUMAN lane gate chips -->
      <rect x="208" y="460" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="208" y="460" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">G1</text>
      <text x="264" y="502" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">brief accepted</text>

      <rect x="368" y="460" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="368" y="460" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="424" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">G2</text>
      <text x="424" y="502" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">spec accepted</text>

      <rect x="528" y="460" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="460" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="584" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">G3</text>
      <text x="584" y="502" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">plan accepted</text>

      <rect x="688" y="460" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="460" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="744" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">G4</text>
      <text x="744" y="502" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">phase P00 ok</text>

      <rect x="848" y="460" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="848" y="460" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="904" y="486" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">G5</text>
      <text x="904" y="502" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">acceptance</text>

      <!-- Legend strip -->
      <line x1="40" y1="580" x2="1144" y2="580" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="596" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="616" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Drafted artifact / gate decision</text>

      <rect x="264" y="616" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="284" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Runner-owned operation</text>

      <rect x="472" y="616" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="492" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Captured evidence</text>

      <rect x="632" y="616" width="14" height="10" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="652" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Human approval band — nothing proceeds without it</text>

      <line x1="1008" y1="622" x2="1036" y2="622" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="1044" y="624" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Evidence path</text>
    </svg>
