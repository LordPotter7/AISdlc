# Mirrors the CI lint job. Install with: uv run --with pre-commit pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: version-agreement
        name: version files agree
        entry: uv run python tools/bump-version.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|\.claude-plugin/.*\.json|desktop/package\.json|desktop/src-tauri/(Cargo\.toml|tauri\.conf\.json))$
