# Documentation, not configuration (ADR-010). The runner's constants in scripts/aisdlc/state.py
# are the source; tests/test_w8_pipeline.py proves this file agrees with them. Editing it changes
# nothing. Per-kind rules belong in .ai-sdlc/pipeline.yaml.
version: 1
stages:
  - {id: 0, name: register, folder: 00-intent}
  - {id: 1, name: frame, folder: 01-brief, gate: G1}
  - {id: 2, name: specify, folder: 02-specification, gate: G2}
  - {id: 3, name: plan, folder: 03-planning, gate: G3}
  - {id: 4, name: build, folder: 04-build, gate: G4, gate_position: after_P00}
  - {id: 5, name: converge, folder: 05-verification, gate: G5}
  - {id: 6, name: close, folder: 06-close}
combined_gates:
  compact: [G2, G3]
release_in_scope: false
deployment_in_scope: false
